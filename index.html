<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#07090f"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#f5f6fa"
      media="(prefers-color-scheme: light)"
    />
    <title>Calculadora de Potes</title>
    <meta
      name="description"
      content="Calcule preços de combos de potes: valor total com desconto, preço por pote, porcentagem OFF e economia — em tempo real, direto no navegador."
    />
    <link
      rel="preload"
      href="fonts/inter-latin-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/png" sizes="64x64" href="img/favicon-64.png" />
    <link rel="apple-touch-icon" href="img/favicon-180.png" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="page">
      <div class="header">
        <div class="header-badge">🫙 Calculadora de Combos</div>
        <h1>Calculadora de Potes</h1>
        <p>
          Configure os combos e calcule preços, economias e valor por pote
          automaticamente
        </p>
      </div>

      <div class="config-card">
        <div class="config-header">
          <h2 class="section-title">Configurações</h2>
          <button
            class="btn-clear"
            id="btn-clear"
            type="button"
            onclick="clearAll(this)"
          >
            Limpar
          </button>
        </div>
        <div class="config-layout">
          <div class="field">
            <label class="field-label" for="base-price"
              >Valor individual por pote</label
            >
            <div class="input-wrap has-prefix">
              <span class="prefix" aria-hidden="true">$</span>
              <input
                type="number"
                id="base-price"
                value="179"
                min="0"
                step="0.01"
                oninput="recalcAll()"
              />
            </div>
          </div>

          <div class="field">
            <div class="field-label" id="lbl-qtys">Quantidades dos combos</div>
            <div class="chips" id="chips" aria-labelledby="lbl-qtys"></div>
            <button class="btn" type="button" onclick="openModal()">
              <span aria-hidden="true">⚙</span> Configurar combos
            </button>
          </div>
        </div>

        <div class="config-mode">
          <span class="field-label" id="lbl-mode">Modo de entrada</span>
          <div class="mode-toggle" role="group" aria-labelledby="lbl-mode">
            <button class="mode-btn active" id="mode-total" type="button" aria-pressed="true" onclick="setMode('total')">Valor total do combo</button>
            <button class="mode-btn" id="mode-ppot" type="button" aria-pressed="false" onclick="setMode('ppot')">Valor por pote</button>
          </div>
        </div>
      </div>

      <div class="grid" id="grid"></div>

      <footer class="footer">
        <span>Desenvolvido por <strong>Gabriel Mendes</strong></span>
        <div class="footer-links">
          <a
            href="https://www.linkedin.com/in/gabriel-mendes-bb5571264/"
            target="_blank"
            rel="noopener"
            class="footer-link"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="currentColor"
            >
              <path
                d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"
              />
            </svg>
            LinkedIn
          </a>
          <a

            rel="noopener"
            class="footer-link"
          >
            <svg

              width="14"
              height="14"

              fill="currentColor"
            >
              <path
